name: diagnostic-smoke

on:
  push:
  pull_request:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the smoke dependency
        run: python -m pip install 'numpy>=1.26'
      - name: Run the unpaid diagnostic tests
        working-directory: granite_query
        run: python -m unittest cloud.test_diagnostic_experiment
